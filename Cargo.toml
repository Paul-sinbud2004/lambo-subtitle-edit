[package]
name = "lambo-subtitle-edit"
version = "1.0.0"
edition = "2021"
description = "Lambo Subtitle Edit - subtitle editor with dual video preview"
authors = ["sinbud2004 <sinbud2004@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Paul-sinbud2004/lambo-subtitle-edit"
homepage = "https://github.com/Paul-sinbud2004/lambo-subtitle-edit"

[dependencies]
eframe = { version = "0.37", default-features = true }
egui = "0.37"
egui-phosphor = { package = "egui-pop-phosphor", version = "0.15" }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gstreamer-base = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
